name: Signed Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Only main is allowed
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Releases must be started from main only.' >&2
          exit 1
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 37 and Build Tools
        run: sdkmanager --install --channel=3 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Check signing configuration
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ] && [ -n "$KS_KEY_PASS" ] || {
            echo 'Missing signing secrets: see README.md' >&2
            exit 1
          }
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/keiscope-signing.jks"
          chmod 600 "$RUNNER_TEMP/keiscope-signing.jks"
      - name: Build signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keiscope-signing.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK signature and prepare release
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          cp "$APK" "KeiScope-v${VERSION}.apk"
          sha256sum "KeiScope-v${VERSION}.apk" > "KeiScope-v${VERSION}.apk.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Create GitHub Release (immutable version)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} exists. Increase versionCode AND versionName before publishing an update." >&2
            exit 1
          fi
          gh release create "v${VERSION}" \
            "KeiScope-v${VERSION}.apk" \
            "KeiScope-v${VERSION}.apk.sha256" \
            --title "KeiScope v${VERSION}" --generate-notes --target main
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/keiscope-signing.jks"

name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 17 SDK
        run: sdkmanager --install --channel=3 'platforms;android-37' 'build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile and test (debug APK, not suitable for update signing)
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: keiscope-debug-ci
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

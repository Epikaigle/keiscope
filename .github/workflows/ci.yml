name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 17 SDK
        run: sdkmanager --install --channel=3 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Unit tests, Android lint and debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease
      - name: Show Android lint findings
        if: always()
        run: |
          if [ -f app/build/reports/lint-results-debug.txt ]; then
            cat app/build/reports/lint-results-debug.txt
          fi
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: keiscope-debug-ci
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
